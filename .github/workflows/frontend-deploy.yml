name: CD - Deploy Frontends to Vercel

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'

jobs:
  deploy-customer-app:
    name: Deploy Customer App (Vercel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/customer-app/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend/customer-app
          npm ci

      - name: Build Customer App
        run: |
          cd frontend/customer-app
          npm run build

      - name: Deploy to Vercel (Customer App)
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_CUSTOMER }}
          working-directory: ./frontend/customer-app
          vercel-args: '--prod'

  deploy-admin-dashboard:
    name: Deploy Admin Dashboard (Vercel)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/admin-dashboard/package-lock.json

      - name: Install dependencies
        run: |
          cd frontend/admin-dashboard
          npm ci

      - name: Build Admin Dashboard
        run: |
          cd frontend/admin-dashboard
          npm run build

      - name: Deploy to Vercel (Admin Dashboard)
        if: env.VERCEL_TOKEN != ''
        uses: amondnet/vercel-action@v25
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID_ADMIN }}
          working-directory: ./frontend/admin-dashboard
          vercel-args: '--prod'
